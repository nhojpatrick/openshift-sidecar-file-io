apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openshift-sidecar-file-io.fullname" . }}
  labels:
    {{- include "openshift-sidecar-file-io.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "openshift-sidecar-file-io.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        deploymentTime: {{ now | date "2006-01-02T15:04:05" }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "openshift-sidecar-file-io.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}-consumer
          image: "{{ .Values.image_consumer.repository }}:{{ .Values.image_consumer.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.volumeMounts_consumer }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: {{ .Chart.Name }}-producer
          image: "{{ .Values.image_producer.repository }}:{{ .Values.image_producer.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.volumeMounts_producer }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
